# ───────────────────────────────────────────────────────────────
#  Project:      sop-Core (template, copied into every repository)
#  Module:       secret-scan workflow
#  Purpose:      Fail a pull request that adds a secret
#  Last Updated: 2026-11-09
#  Requirements: GitHub Actions, ubuntu-latest
#  Author:       T. Dylan Maher
#  Description:  Downloads a pinned gitleaks release, verifies it against the
#                release checksum file, and scans only the commits this pull
#                request adds (older history is handled separately).
#  Caveats:      Copy to .github/workflows/secret-scan.yml unchanged.
#  Revision:     v0.1
# ───────────────────────────────────────────────────────────────
name: secret-scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # IN: pinned version | DO: download and checksum-verify gitleaks | OUT: binary | WHY: no unverified code in CI
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "${base}/${tarball}"
          curl -sSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "${tarball}" gitleaks

      # IN: PR base and head | DO: scan only the new commits | OUT: pass/fail | WHY: catch new leaks without re-flagging old history
      - name: Scan pull request commits
        run: |
          ./gitleaks git . --no-banner --redact --verbose \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

